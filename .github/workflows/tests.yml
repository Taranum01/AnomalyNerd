name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is EOL (Oct 2025) and setup-python can no longer provision it
        # on the current ubuntu-latest runner image.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r web/requirements.txt
      - name: Run the test suite
        run: python -m pytest -q
        # The optional docling layout backend is not installed here; the tests that
        # need it skip themselves, matching a fresh contributor's environment.
