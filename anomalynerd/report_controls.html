        <button onclick="saveSource()" style="padding:6px 14px;border-radius:6px;border:none;
          font-size:calc(13px * var(--font-scale));font-weight:600;cursor:pointer;background:#A6E3A1;color:#1E1E2E;">Apply</button>
        <button onclick="closeSourceEditor()" style="padding:6px 14px;border-radius:6px;border:none;
          font-size:calc(13px * var(--font-scale));font-weight:600;cursor:pointer;background:rgba(255,255,255,0.06);
          color:#CDD6F4;">Back</button>
      </div>
    </div>
    <div style="flex:1;position:relative;overflow:hidden;">
      <textarea id="editor-area" spellcheck="false" style="width:100%;height:100%;
        resize:none;border:none;outline:none;padding:16px 16px 16px 56px;
        font-family:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:calc(13px * var(--font-scale));
        line-height:1.6;background:#1E1E2E;color:#CDD6F4;tab-size:2;
        white-space:pre;overflow:auto;box-sizing:border-box;"></textarea>
      <div id="editor-lines" style="position:absolute;top:0;left:0;width:44px;height:100%;
        padding:16px 8px 16px 0;text-align:right;font-family:'SF Mono',SFMono-Regular,Menlo,
        Consolas,monospace;font-size:calc(13px * var(--font-scale));line-height:1.6;color:#45475A;
        pointer-events:none;overflow:hidden;background:#181825;
        border-right:1px solid rgba(255,255,255,0.05);user-select:none;"></div>
    </div>
  </div>
</div>


<div id="ui-toolbar" style="position:fixed;bottom:16px;right:16px;z-index:9999;
  display:flex;align-items:center;gap:2px;background:rgba(0,0,0,0.06);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:4px 6px;
  border-radius:100px;font-family:Verdana,sans-serif;user-select:none;
  cursor:grab;touch-action:none;transition:bottom 0.3s cubic-bezier(0.25,0.46,0.45,0.94),
  top 0.3s cubic-bezier(0.25,0.46,0.45,0.94),left 0.3s cubic-bezier(0.25,0.46,0.45,0.94),
  right 0.3s cubic-bezier(0.25,0.46,0.45,0.94);">
  <button onclick="adjSize(-0.1)" style="width:30px;height:30px;border:none;border-radius:50%;background:transparent;cursor:pointer;color:inherit;display:flex;align-items:center;justify-content:center;" title="Smaller text">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>
  </button>
  <span id="size-label" style="font-size:calc(11px * var(--font-scale));font-weight:600;min-width:32px;text-align:center;opacity:0.5;pointer-events:none;">100%</span>
  <button onclick="adjSize(0.1)" style="width:30px;height:30px;border:none;border-radius:50%;background:transparent;cursor:pointer;color:inherit;display:flex;align-items:center;justify-content:center;" title="Larger text">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <div style="width:1px;height:16px;background:currentColor;opacity:0.15;margin:0 2px;"></div>
  <button style="width:44px;height:44px;border:none;border-radius:50%;background:transparent;color:inherit;cursor:pointer" type="button" onclick="toggleDark()" title="Toggle dark mode" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button><button style="width:44px;height:44px;border:none;border-radius:50%;background:transparent;color:inherit;cursor:pointer" type="button" onclick="setPreview('mobile')" title="Mobile preview" aria-label="Mobile preview"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></svg></button><button style="width:44px;height:44px;border:none;border-radius:50%;background:transparent;color:inherit;cursor:pointer" type="button" onclick="setPreview('desktop')" title="Full width" aria-label="Full width"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"><rect x="2" y="3" width="20" height="14"/><path d="M8 21h8M12 17v4"/></svg></button><button onclick="openEditor()" id="edit-btn" style="width:30px;height:30px;border:none;border-radius:50%;background:transparent;cursor:pointer;color:inherit;display:flex;align-items:center;justify-content:center;" title="Edit page (Ctrl+E)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
  </button>
  <div style="width:1px;height:16px;background:currentColor;opacity:0.15;margin:0 2px;"></div>
  <div style="padding:0 4px;cursor:grab;opacity:0.3;display:flex;align-items:center;" title="Drag to reposition">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="6" r="2"/><circle cx="14" cy="6" r="2"/><circle cx="6" cy="14" r="2"/><circle cx="14" cy="14" r="2"/><circle cx="6" cy="22" r="2"/><circle cx="14" cy="22" r="2"/></svg>
  </div>
</div>

<script>
let fs = 1; try { fs = parseFloat(localStorage.getItem('ui-font-scale') || '1'); } catch (e) {}
if (!Number.isFinite(fs)) fs = 1; fs = Math.max(0.5, Math.min(2.5, fs));
document.documentElement.style.setProperty('--font-scale', fs);
document.getElementById('size-label').textContent = Math.round(fs * 100) + '%';

function adjSize(d) {
  fs = Math.max(0.5, Math.min(2.5, +(fs + d).toFixed(1)));
  document.documentElement.style.setProperty('--font-scale', fs);
  document.getElementById('size-label').textContent = Math.round(fs * 100) + '%';
  try { localStorage.setItem('ui-font-scale', fs); } catch (e) {}
}
(function() {
  const el = document.getElementById('ui-toolbar');
  let dragging = false, startX, startY, elX, elY;
  const M = 16;
  let saved = null; try { saved = JSON.parse(localStorage.getItem('ui-toolbar-pos') || 'null'); } catch (e) {}
  if (saved) applyPos(saved);
  function applyPos(p) {
    el.style.transition = 'none';
    el.style.top = p.top != null ? p.top + 'px' : 'auto';
    el.style.bottom = p.bottom != null ? p.bottom + 'px' : 'auto';
    el.style.left = p.left != null ? p.left + 'px' : 'auto';
    el.style.right = p.right != null ? p.right + 'px' : 'auto';
    void el.offsetHeight;
    el.style.transition = '';
  }
  function snapToCorner() {
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const pos = {};
    if (cy < innerHeight / 2) { pos.top = M; pos.bottom = null; } else { pos.bottom = M; pos.top = null; }
    if (cx < innerWidth / 2) { pos.left = M; pos.right = null; } else { pos.right = M; pos.left = null; }
    el.style.transition = 'all 0.3s cubic-bezier(0.25,0.46,0.45,0.94)';
    applyPos(pos);
    try { localStorage.setItem('ui-toolbar-pos', JSON.stringify(pos)); } catch (e) {}
  }
  el.addEventListener('pointerdown', function(e) {
    if (e.target.closest('button')) return;
    dragging = true; el.style.cursor = 'grabbing'; el.style.transition = 'none';
    const r = el.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY; elX = r.left; elY = r.top;
    el.setPointerCapture(e.pointerId);
  });
  window.addEventListener('pointermove', function(e) {
    if (!dragging) return;
    el.style.top = (elY + e.clientY - startY) + 'px'; el.style.bottom = 'auto';
    el.style.left = (elX + e.clientX - startX) + 'px'; el.style.right = 'auto';
  });
  window.addEventListener('pointerup', function() { if (!dragging) return; dragging = false; el.style.cursor = 'grab'; snapToCorner(); });
})();
let isEditing = false, editSnapshot = '', lastFocusedBlock = null;

function openEditor() {
  if (isEditing) { cancelEdits(); return; }
  isEditing = true;
  const content = document.getElementById('ui-content');
  editSnapshot = content.innerHTML;
  content.contentEditable = 'true';
  content.style.outline = '2px dashed rgba(166,227,161,0.3)';
  content.style.outlineOffset = '-2px';
  document.getElementById('ui-edit-bar').style.display = 'flex';
  document.getElementById('edit-btn').style.background = 'rgba(166,227,161,0.2)';
  content.addEventListener('click', trackFocusedBlock);
  content.querySelectorAll('.slide').forEach(s => { s.style.pointerEvents = 'all'; });
}

function trackFocusedBlock(e) {
  lastFocusedBlock = e.target.closest('div,section,article,li,tr,p,h1,h2,h3,h4,h5,h6');
}

function saveEdits() {
  const content = document.getElementById('ui-content');
  content.contentEditable = 'false';
  content.style.outline = ''; content.style.outlineOffset = '';
  content.removeEventListener('click', trackFocusedBlock);
  document.getElementById('ui-edit-bar').style.display = 'none';
  document.getElementById('edit-btn').style.background = 'transparent';
  editSnapshot = ''; isEditing = false;
  document.getElementById('report-edit-status').textContent = 'Edited report: re-run the CSV to restore computed output.';
}

function cancelEdits() {
  const content = document.getElementById('ui-content');
  content.innerHTML = editSnapshot;
  content.contentEditable = 'false';
  content.style.outline = ''; content.style.outlineOffset = '';
  content.removeEventListener('click', trackFocusedBlock);
  document.getElementById('ui-edit-bar').style.display = 'none';
  document.getElementById('edit-btn').style.background = 'transparent';
  isEditing = false;
}

function downloadEdits() {
  const content = document.getElementById('ui-content');
  const styleEl = document.querySelector('head style');
  const html = '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>' + document.title + '</title>\n<style>\n' + (styleEl ? styleEl.textContent : '') + '\n</style>\n</head>\n<body>\n<p>Edited copy. This page is not the original computed report.</p>\n' + content.innerHTML + '\n</body>\n</html>';
  const blob = new Blob([html], {type: 'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = (document.title || 'page').replace(/[^a-z0-9-]/gi, '-').toLowerCase() + '.html';
  a.click(); URL.revokeObjectURL(url);
}
function togglePanel(id) {
  const panel = document.getElementById(id);
  const visible = panel.style.display !== 'none';
  document.querySelectorAll('[id$="-panel"]').forEach(p => p.style.display = 'none');
  if (!visible) panel.style.display = (id === 'badge-panel' || id === 'border-panel') ? 'flex' : 'grid';
}
document.addEventListener('click', e => {
  if (!e.target.closest('[id$="-panel"]') && !e.target.closest('[onclick*="togglePanel"]'))
    document.querySelectorAll('[id$="-panel"]').forEach(p => p.style.display = 'none');
});

function applyColor(hex) { document.execCommand('foreColor', false, hex); togglePanel('text-color-panel'); }
function applyBgColor(hex) { document.execCommand('hiliteColor', false, hex); togglePanel('bg-color-panel'); }
function applyFont(family) { document.execCommand('fontName', false, family); }
function applyHeading(tag) { document.execCommand('formatBlock', false, '<' + tag + '>'); }

function insertLink() {
  const url = prompt('Enter URL:');
  if (url) document.execCommand('createLink', false, url);
}

function cycleTextTransform() {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const text = sel.toString();
  let transformed;
  if (text === text.toLowerCase()) transformed = text.toUpperCase();
  else if (text === text.toUpperCase()) transformed = text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
  else transformed = text.toLowerCase();
  document.execCommand('insertText', false, transformed);
}

function changeFontSize(delta) {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  try {
    const range = sel.getRangeAt(0);
    const span = document.createElement('span');
    const parent = sel.anchorNode.parentElement;
    const current = parseFloat(getComputedStyle(parent).fontSize) || 16;
    span.style.fontSize = Math.max(8, Math.min(120, current + delta)) + 'px';
    range.surroundContents(span);
  } catch(e) {
    const size = delta > 0 ? '5' : '2';
    document.execCommand('fontSize', false, size);
  }
}

function insertBadge(text, color) {
  const html = '<span style="display:inline-block;font-size:calc(14px * var(--font-scale));font-weight:700;text-transform:uppercase;letter-spacing:0.08em;padding:2px 8px;border-radius:100px;background:' + color + ';color:#FFFFFF;">' + text + '</span>&nbsp;';
  document.execCommand('insertHTML', false, html);
  togglePanel('badge-panel');
}

function duplicateBlock() {
  const block = lastFocusedBlock || document.getSelection()?.anchorNode?.parentElement;
  if (block && block.closest('#ui-content')) {
    const clone = block.cloneNode(true);
    block.parentNode.insertBefore(clone, block.nextSibling);
  }
}

let deletedBlock = null;
function deleteBlock() {
  const block = lastFocusedBlock || document.getSelection()?.anchorNode?.parentElement;
  if (block && block.closest('#ui-content') && block !== document.getElementById('ui-content')) {
    deletedBlock = { el: block.cloneNode(true), parent: block.parentNode, next: block.nextSibling };
    block.remove();
  }
}

let borderTarget = null;
document.getElementById('ui-content')?.addEventListener('click', function(e) {
  if (isEditing) borderTarget = e.target.closest('div,section,article,span,p,h1,h2,h3,h4,h5,h6,table,li');
});
function adjustBorder(prop, value) {
  const el = borderTarget || lastFocusedBlock;
  if (!el) return;
  if (prop === 'width') el.style.border = value + 'px solid ' + (el.style.borderColor || '#D1D5DB');
  if (prop === 'radius') el.style.borderRadius = value + 'px';
  if (prop === 'color') el.style.borderColor = value;
}
let editorTab = 'content', editorContentCache = '', editorStylesCache = '';

function openSourceEditor() {
  const content = document.getElementById('ui-content');
  const styleEl = document.querySelector('head style');
  editorContentCache = content.innerHTML;
  editorStylesCache = styleEl ? styleEl.textContent : '';
  editorTab = 'content';
  document.getElementById('editor-area').value = editorContentCache;
  updateEditorTabs(); updateLineNumbers();
  document.getElementById('ui-editor-modal').style.display = 'block';
}
function closeSourceEditor() { document.getElementById('ui-editor-modal').style.display = 'none'; }
function switchEditorTab(tab) {
  const area = document.getElementById('editor-area');
  if (editorTab === 'content') editorContentCache = area.value; else editorStylesCache = area.value;
  editorTab = tab; area.value = tab === 'content' ? editorContentCache : editorStylesCache;
  updateEditorTabs(); updateLineNumbers();
}
function updateEditorTabs() {
  document.getElementById('tab-content').style.background = editorTab === 'content' ? 'rgba(255,255,255,0.1)' : 'transparent';
  document.getElementById('tab-content').style.color = editorTab === 'content' ? '#CDD6F4' : '#6C7086';
  document.getElementById('tab-styles').style.background = editorTab === 'styles' ? 'rgba(255,255,255,0.1)' : 'transparent';
  document.getElementById('tab-styles').style.color = editorTab === 'styles' ? '#CDD6F4' : '#6C7086';
}
function updateLineNumbers() {
  const area = document.getElementById('editor-area');
  document.getElementById('editor-lines').innerHTML = Array.from({length: area.value.split('\n').length}, (_, i) => i + 1).join('<br>');
}
function saveSource() {
  const area = document.getElementById('editor-area');
  if (editorTab === 'content') editorContentCache = area.value; else editorStylesCache = area.value;
  document.getElementById('ui-content').innerHTML = editorContentCache;
  const styleEl = document.querySelector('head style');
  if (styleEl) styleEl.textContent = editorStylesCache;
  closeSourceEditor();
}
document.getElementById('editor-area').addEventListener('keydown', function(e) {
  if (e.key === 'Tab') { e.preventDefault(); const s = this.selectionStart; this.value = this.value.substring(0, s) + '  ' + this.value.substring(this.selectionEnd); this.selectionStart = this.selectionEnd = s + 2; updateLineNumbers(); }
});
document.getElementById('editor-area').addEventListener('input', updateLineNumbers);
document.getElementById('editor-area').addEventListener('scroll', function() { document.getElementById('editor-lines').scrollTop = this.scrollTop; });
let darkMode = false;
function toggleDark() {
 darkMode = !darkMode; document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
}
function setPreview(mode) {
 const sizes = {mobile:'375px',tablet:'768px',desktop:'1100px'};
 document.getElementById('ui-content').style.maxWidth = sizes[mode];
}
document.addEventListener('keydown', function(e) {
 if ((e.ctrlKey || e.metaKey) && e.key === 'e') {e.preventDefault();openEditor();}
 if ((e.ctrlKey || e.metaKey) && e.key === '0') {e.preventDefault();fs=1;adjSize(0);}
 if (e.key === 'Escape') {if (isEditing) cancelEdits();closeSourceEditor();setPreview('desktop');}
});
</script>
